# =============================================================================
# PROJECT BUILD CONFIGURATION
#
# This project currently runs:
#
# - Python 3.12+
# - FastAPI
# - Uvicorn
# - Pydantic 2
# - SQLAlchemy 2 async
# - MySQL through asyncmy
#
# Celery, Redis, PostgreSQL, Microsoft SQL Server, and MongoDB are retained as
# optional dependency groups. They are not installed by default.
# =============================================================================


# =============================================================================
# BUILD SYSTEM
# =============================================================================

[build-system]
requires = [
    "setuptools>=75,<82",
    "wheel>=0.45,<1",
]

build-backend = "setuptools.build_meta"


# =============================================================================
# PROJECT METADATA
# =============================================================================

[project]
name = "fastapi-service"
version = "1.0.0"

description = """
Reusable production-oriented FastAPI microservice foundation with asynchronous
SQLAlchemy and MySQL support.
"""

readme = "README.md"

requires-python = ">=3.12,<3.15"

license = {
    text = "Proprietary"
}

authors = [
    {
        name = "Development Team"
    },
]

maintainers = [
    {
        name = "Development Team"
    },
]

keywords = [
    "fastapi",
    "microservice",
    "asyncio",
    "sqlalchemy",
    "mysql",
    "rest-api",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]


# =============================================================================
# ACTIVE RUNTIME DEPENDENCIES
#
# Only dependencies required by the FastAPI service and active MySQL
# integration belong in this section.
#
# Celery and other database drivers are intentionally excluded.
# =============================================================================

dependencies = [
    # -------------------------------------------------------------------------
    # WEB FRAMEWORK
    # -------------------------------------------------------------------------

    "fastapi>=0.115,<1.0",

    # Uvicorn standard includes production-supporting dependencies such as
    # uvloop on supported Unix platforms, httptools, and watchfiles.
    "uvicorn[standard]>=0.34,<1.0",

    # -------------------------------------------------------------------------
    # DATA VALIDATION AND SETTINGS
    # -------------------------------------------------------------------------

    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",

    # -------------------------------------------------------------------------
    # DATABASE
    # -------------------------------------------------------------------------

    "SQLAlchemy[asyncio]>=2.0.40,<3.0",

    # Active asynchronous MySQL/MariaDB driver.
    "asyncmy>=0.2.11,<0.3",

    # -------------------------------------------------------------------------
    # STRUCTURED LOGGING
    # -------------------------------------------------------------------------

    "python-json-logger>=3.3,<5.0",

    # -------------------------------------------------------------------------
    # TIMEZONE DATA
    #
    # Windows installations may not include the IANA timezone database.
    # tzdata ensures zoneinfo can resolve configured timezone names.
    # -------------------------------------------------------------------------

    "tzdata>=2025.2; platform_system == 'Windows'",
]


# =============================================================================
# OPTIONAL DEPENDENCY GROUPS
#
# Install optional features only when they are activated in application code.
#
# Examples:
#
#     pip install -e ".[dev]"
#     pip install -e ".[worker]"
#     pip install -e ".[postgres]"
#     pip install -e ".[all-databases]"
# =============================================================================

[project.optional-dependencies]


# -----------------------------------------------------------------------------
# DEVELOPMENT AND TESTING
# -----------------------------------------------------------------------------

dev = [
    # Testing framework.
    "pytest>=8.4,<10.0",

    # Async pytest support.
    "pytest-asyncio>=1.1,<2.0",

    # HTTP client used by FastAPI integration tests.
    "httpx>=0.28,<1.0",

    # Test coverage.
    "coverage[toml]>=7.10,<8.0",
    "pytest-cov>=6.2,<8.0",

    # Static analysis and formatting.
    "ruff>=0.12,<1.0",
    "mypy>=1.17,<2.0",

    # Type information for selected dependencies.
    "types-python-dateutil>=2.9,<3.0",

    # Security-oriented dependency inspection.
    "pip-audit>=2.9,<3.0",
]


# -----------------------------------------------------------------------------
# CELERY WORKER
#
# This group is not installed by default.
#
# Activate only after:
#
# - Celery settings are uncommented in app/core/config.py,
# - worker code is ready,
# - broker infrastructure is available,
# - task implementations and tests are complete.
#
# Install using:
#
#     pip install -e ".[worker]"
# -----------------------------------------------------------------------------

worker = [
    "celery>=5.5,<6.0",

    # Redis is included as the initial supported Celery transport.
    # Remove this dependency when RabbitMQ is the only broker.
    "redis>=6.2,<8.0",
]


# -----------------------------------------------------------------------------
# APPLICATION REDIS
#
# This group is independent of Celery. Use it for application caching,
# distributed locks, idempotency, or other direct Redis operations.
# -----------------------------------------------------------------------------

redis = [
    "redis>=6.2,<8.0",
]


# -----------------------------------------------------------------------------
# POSTGRESQL
# -----------------------------------------------------------------------------

postgres = [
    "asyncpg>=0.30,<1.0",
]


# -----------------------------------------------------------------------------
# MICROSOFT SQL SERVER
#
# The operating system must also provide the required Microsoft ODBC driver.
# -----------------------------------------------------------------------------

mssql = [
    "aioodbc>=0.5,<1.0",
    "pyodbc>=5.2,<6.0",
]


# -----------------------------------------------------------------------------
# MONGODB
# -----------------------------------------------------------------------------

mongo = [
    "pymongo>=4.13,<5.0",
]


# -----------------------------------------------------------------------------
# ALL OPTIONAL DATABASE CLIENTS
#
# This does not include Celery.
# -----------------------------------------------------------------------------

all-databases = [
    "redis>=6.2,<8.0",
    "asyncpg>=0.30,<1.0",
    "aioodbc>=0.5,<1.0",
    "pyodbc>=5.2,<6.0",
    "pymongo>=4.13,<5.0",
]


# -----------------------------------------------------------------------------
# COMPLETE LOCAL DEVELOPMENT INSTALLATION
#
# This group is useful only when developers need every optional adapter and
# Celery locally.
#
# Avoid installing it in the production FastAPI image.
# -----------------------------------------------------------------------------

all = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.1,<2.0",
    "httpx>=0.28,<1.0",
    "coverage[toml]>=7.10,<8.0",
    "pytest-cov>=6.2,<8.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.17,<2.0",
    "pip-audit>=2.9,<3.0",
    "celery>=5.5,<6.0",
    "redis>=6.2,<8.0",
    "asyncpg>=0.30,<1.0",
    "aioodbc>=0.5,<1.0",
    "pyodbc>=5.2,<6.0",
    "pymongo>=4.13,<5.0",
]


# =============================================================================
# COMMAND-LINE ENTRY POINTS
#
# The Docker container may continue to start Uvicorn directly.
#
# This command enables:
#
#     fastapi-service
# =============================================================================

[project.scripts]
fastapi-service = "app.main:run"


# =============================================================================
# SETUPTOOLS PACKAGE DISCOVERY
# =============================================================================

[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = [
    "tests*",
    "docs*",
]


# =============================================================================
# PYTEST
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    "--strict-config",
    "--strict-markers",
    "--showlocals",
    "--tb=short",
    "--disable-warnings",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]

asyncio_mode = "auto"

asyncio_default_fixture_loop_scope = "function"

markers = [
    "unit: Fast isolated unit tests.",
    "integration: Tests involving database or application integration.",
    "api: FastAPI endpoint tests.",
    "slow: Tests that take longer than normal unit tests.",
]


# =============================================================================
# COVERAGE
# =============================================================================

[tool.coverage.run]
branch = true
parallel = true

source = [
    "app",
]

omit = [
    "tests/*",
    "app/worker/*",
]


[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]


[tool.coverage.html]
directory = "htmlcov"


[tool.coverage.xml]
output = "coverage.xml"


# =============================================================================
# RUFF
# =============================================================================

[tool.ruff]
target-version = "py312"

line-length = 88

indent-width = 4

extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "htmlcov",
]


[tool.ruff.lint]
select = [
    # Pyflakes.
    "F",

    # pycodestyle errors and warnings.
    "E",
    "W",

    # Import sorting.
    "I",

    # Naming rules.
    "N",

    # Upgrade syntax for supported Python version.
    "UP",

    # flake8-bugbear.
    "B",

    # flake8-builtins.
    "A",

    # flake8-comprehensions.
    "C4",

    # flake8-simplify.
    "SIM",

    # flake8-return.
    "RET",

    # flake8-pytest-style.
    "PT",

    # Logging rules.
    "LOG",
    "G",

    # Exception-handling rules.
    "TRY",

    # Security checks.
    "S",

    # Pylint-derived rules.
    "PL",

    # Ruff-specific rules.
    "RUF",

    # Docstring rules.
    "D",

    # Async-specific rules.
    "ASYNC",

    # Type-checking import rules.
    "TC",
]

ignore = [
    # Allow blank lines before class docstrings where formatter decisions vary.
    "D203",

    # Use the D212 multiline docstring style.
    "D213",

    # Exception messages are intentionally readable inline in this project.
    "TRY003",

    # Long exception messages are acceptable for configuration validation.
    "EM101",
    "EM102",

    # FastAPI dependency defaults commonly use function calls.
    "B008",

    # Boolean positional parameters are prevented through code review where
    # appropriate; enforcing this globally is too restrictive.
    "FBT001",
    "FBT002",

    # Application logging intentionally uses formatted message fields in some
    # structured contexts.
    "G004",
]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    # Tests may use assert directly.
    "S101",

    # Test functions do not require docstrings.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",

    # Tests may use magic values directly for readability.
    "PLR2004",
]

"app/worker/**/*.py" = [
    # Celery imports and optional worker code may remain unused until task
    # modules are introduced.
    "F401",
]


[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

known-first-party = [
    "app",
]

section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 88


# =============================================================================
# MYPY
# =============================================================================

[tool.mypy]
python_version = "3.12"

plugins = [
    "pydantic.mypy",
]

files = [
    "app",
]

exclude = [
    "^tests/",
    "^build/",
    "^dist/",
]

strict = true

show_error_codes = true
show_column_numbers = true
pretty = true

warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

no_implicit_optional = true
strict_equality = true

# SQLAlchemy 2 provides native typing and does not require the legacy mypy
# plugin.
namespace_packages = true
explicit_package_bases = true


# =============================================================================
# PYDANTIC MYPY PLUGIN
# =============================================================================

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


# =============================================================================
# PACKAGE-SPECIFIC MYPY OVERRIDES
# =============================================================================

[[tool.mypy.overrides]]
module = [
    "asyncmy",
    "asyncmy.*",
]
ignore_missing_imports = true


# Optional Celery packages are ignored by type checking until the worker
# dependency group is installed in the checking environment.
[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "kombu",
    "kombu.*",
]
ignore_missing_imports = true


# Optional database clients are ignored unless their dependency groups are
# installed.
[[tool.mypy.overrides]]
module = [
    "aioodbc",
    "aioodbc.*",
    "asyncpg",
    "asyncpg.*",
    "pymongo",
    "pymongo.*",
    "redis",
    "redis.*",
]
ignore_missing_imports = true