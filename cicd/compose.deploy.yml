services:
  api:
    image: "${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: "${API_CONTAINER_NAME:-fastapi-service}"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - "${APP_ENV_FILE:?APP_ENV_FILE is required}"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8000/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: "${API_MEMORY_LIMIT:-1g}"
    cpus: "${API_CPU_LIMIT:-1.0}"
    networks:
      - application-network

