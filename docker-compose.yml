# =============================================================================
# FASTAPI SERVICE
#
# This Compose file starts the FastAPI application and background processes.
#
# It does not create or manage:
#
# - Microsoft SQL Server
# - MongoDB
#
# External infrastructure must be reachable through URLs configured in .env.
# =============================================================================

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - application-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - application-network

  api:
    # =========================================================================
    # IMAGE BUILD
    # =========================================================================

    build:
      # Use the current project directory as the Docker build context.
      context: .

      # Use the production-oriented Dockerfile in the project root.
      dockerfile: Dockerfile

    # Give the generated image a reusable local name.
    image: fastapi-service:latest

    # Give the running container a predictable name.
    container_name: fastapi-service

    # =========================================================================
    # PROCESS AND RESTART BEHAVIOR
    # =========================================================================

    # Restart automatically after unexpected process or host failures.
    #
    # Manual stops remain stopped until explicitly started again.
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    # Give Uvicorn time to finish active requests and close database pools.
    stop_grace_period: 30s

    # Initialize a minimal PID 1 process for correct signal forwarding and
    # zombie-process cleanup.
    init: true

    # =========================================================================
    # ENVIRONMENT CONFIGURATION
    # =========================================================================

    # Load application settings and external database URLs from the local .env
    # file.
    #
    # The .env file must not be committed to source control or copied into the
    # Docker image.
    env_file:
      # Local overrides are optional; the application has safe development
      # defaults and production deployments can inject variables directly.
      - path: .env
        required: false

    environment:
      # Bind the application to all container network interfaces.
      HOST: "0.0.0.0"

      # Keep the internal container port fixed. The host mapping can be changed
      # independently through APP_PORT.
      PORT: "8000"

      # Use the Compose service hostname inside Docker. The local .env URL
      # continues to target localhost for Windows-hosted Python execution.
      ENABLE_POSTGRES: "true"
      POSTGRES_URL: ${POSTGRES_DOCKER_URL:?Set POSTGRES_DOCKER_URL in .env}

      BACKGROUND_JOBS_ENABLED: "true"
      REDIS_URL: ${REDIS_DOCKER_URL:?Set REDIS_DOCKER_URL in .env}
      BACKGROUND_PAYLOAD_ENCRYPTION_KEY: ${BACKGROUND_PAYLOAD_ENCRYPTION_KEY:?Generate a Fernet key in .env}

    # =========================================================================
    # PORT MAPPING
    # =========================================================================

    ports:
      # APP_PORT controls the host port.
      #
      # Examples:
      #
      # APP_PORT=8000  -> http://localhost:8000
      # APP_PORT=8080  -> http://localhost:8080
      #
      # The default is 8000 when APP_PORT is absent.
      - "${APP_PORT:-8000}:8000"

    # =========================================================================
    # HEALTH CHECK
    # =========================================================================

    healthcheck:
      # Use the FastAPI liveness endpoint.
      #
      # Change this path when the project exposes a different liveness route.
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8000/health/live

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # =========================================================================
    # SECURITY
    # =========================================================================

    # Prevent the container from gaining additional Linux privileges.
    security_opt:
      - no-new-privileges:true

    # Drop all Linux capabilities because the service does not require them.
    cap_drop:
      - ALL

    # Use a temporary filesystem for standard temporary-file operations.
    tmpfs:
      - /tmp:size=64m,mode=1777

    # =========================================================================
    # LOGGING
    # =========================================================================

    # Prevent Docker JSON log files from growing without limit.
    logging:
      driver: json-file

      options:
        max-size: "10m"
        max-file: "5"

    # =========================================================================
    # RESOURCE LIMITS
    # =========================================================================

    # These limits protect local and single-host deployments.
    #
    # Adjust them after measuring the application's real workload.
    mem_limit: 1g
    cpus: 1.0

    # =========================================================================
    # NETWORK
    # =========================================================================

    networks:
      - application-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-service:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file:
      - path: .env
        required: false
    environment:
      ENABLE_POSTGRES: "true"
      POSTGRES_URL: ${POSTGRES_DOCKER_URL:?Set POSTGRES_DOCKER_URL in .env}
      BACKGROUND_JOBS_ENABLED: "true"
      REDIS_URL: ${REDIS_DOCKER_URL:?Set REDIS_DOCKER_URL in .env}
      BACKGROUND_PAYLOAD_ENCRYPTION_KEY: ${BACKGROUND_PAYLOAD_ENCRYPTION_KEY:?Generate a Fernet key in .env}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
    command:
      - celery
      - -A
      - app.worker.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - application-network

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-service:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      ENABLE_POSTGRES: "true"
      POSTGRES_URL: ${POSTGRES_DOCKER_URL:?Set POSTGRES_DOCKER_URL in .env}
      BACKGROUND_JOBS_ENABLED: "true"
      REDIS_URL: ${REDIS_DOCKER_URL:?Set REDIS_DOCKER_URL in .env}
      BACKGROUND_PAYLOAD_ENCRYPTION_KEY: ${BACKGROUND_PAYLOAD_ENCRYPTION_KEY:?Generate a Fernet key in .env}
    command:
      - celery
      - -A
      - app.worker.celery_app:celery_app
      - beat
      - --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - application-network


# =============================================================================
# APPLICATION NETWORK
# =============================================================================

networks:
  application-network:
    # Private bridge network for this Compose project.
    driver: bridge


volumes:
  postgres-data:
  redis-data:
