version: "3.9"

services:
  api:
    build: .
    container_name: fastapi-app
    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env   # ✅ use real env

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    # ❌ No external port exposure
    # ports: REMOVED

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge